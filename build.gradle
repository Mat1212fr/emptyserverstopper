plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

group = project.maven_group
version = "${project.mod_version}"

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"emptyserverstopper" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Fabric API mappings for supported Minecraft versions
def fabricApiVersions = [
	"26.1.2": "0.154.2+26.1.2",
	"26.2"  : "0.152.1+26.2",
	"26.3"  : "0.165.0+26.3"
]

def effectiveMcVersion = project.property("minecraft_version")
def effectiveFabricApi = project.hasProperty("fabric_api_version") && project.property("fabric_api_version") != "" ?
	project.property("fabric_api_version") :
	fabricApiVersions.getOrDefault(effectiveMcVersion, project.fabric_api_version)

dependencies {
	minecraft "com.mojang:minecraft:${effectiveMcVersion}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${effectiveFabricApi}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property "minecraft_dependency", project.minecraft_dependency
	inputs.property "loader_dependency", project.loader_dependency

	filesMatching("fabric.mod.json") {
		expand "version": version,
		       "minecraft_dependency": project.minecraft_dependency,
		       "loader_dependency": project.loader_dependency
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('sourcesJar') {
	enabled = false
}

tasks.named('build').configure {
	mustRunAfter("clean")
}
tasks.named('runServer').configure {
	mustRunAfter("build")
}

tasks.register("cleanBuildRunServer") {
	group = "fabric_custom"
	description = "Clean project, recompile it and launch server."
	dependsOn("clean", "build", "runServer")
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	archiveFileName = "${project.name}-${project.version}.jar"

	from("LICENSE")
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
